<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist | THE CLEEDS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="wishlist-page">
    <!-- Navigation Bar Placeholder -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="container" data-wishlist-page>
        <h2>My Wishlist</h2>
        
        <div id="wishlist-items" class="wishlist-items">
            <!-- Wishlist items will be populated here by JavaScript -->
        </div>

        <div id="empty-wishlist" class="empty-state-card" style="display: none;">
            <div class="empty-state-icon">❤️</div>
            <h3>Your Wishlist is Empty</h3>
            <p>Save your favorite products and view them here.</p>
            <a href="products.html" class="btn empty-state-btn">Browse Products</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 THE CLEEDS. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
