<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - THE CLEEDS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar Placeholder -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="container">
        <h2>Shopping Cart</h2>
        
        <div id="cart-items" class="cart-items">
            <!-- Cart items will be populated here by JavaScript -->
        </div>

        <div id="empty-cart" class="empty-state-card" style="display: none;">
            <div class="empty-state-icon">🛒</div>
            <h3>Your Cart is Empty</h3>
            <p>Looks like you haven't added any products yet.</p>
            <a href="products.html" class="btn empty-state-btn">Continue Shopping</a>
        </div>

        <div id="cart-summary" class="cart-summary" style="display: none;">
            <div class="summary-row">
                <span>Subtotal:</span>
                <span id="subtotal">₹0.00</span>
            </div>
            <div class="summary-row">
                <span>Shipping:</span>
                <span>Free</span>
            </div>
            <div class="coupon-section">
                <input type="text" id="coupon-input" class="coupon-input" placeholder="Enter Coupon Code" aria-label="Coupon Code">
                <button type="button" id="apply-coupon-btn" class="btn apply-coupon-btn">Apply</button>
            </div>
            <p id="coupon-message" class="coupon-message" role="alert" aria-live="polite"></p>
            <div id="discount-row" class="summary-row discount-row" style="display: none; color: #e74c3c;">
                <span>Discount (<span id="discount-percent">0</span>%):</span>
                <span id="discount-amount">-₹0.00</span>
            </div>
            <div class="summary-row total">
                <span>Total:</span>
                <span id="total-price">₹0.00</span>
            </div>
            <button id="checkout-btn" class="btn btn-checkout">Proceed to Checkout</button>
            <a href="products.html" class="btn btn-secondary">Continue Shopping</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 THE CLEEDS. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
    <script src="cart.js"></script>
</body>
</html>
